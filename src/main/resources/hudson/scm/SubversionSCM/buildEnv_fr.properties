SVN_REVISION.blurb=Numéro de révision Subversion actuellement extrait dans l''espace de travail, par exemple "12345". Non défini lorsque plusieurs emplacements de modules sont utilisés.
SVN_URL.blurb=URL Subversion actuellement extraite dans l''espace de travail. Non définie lorsque plusieurs emplacements de modules sont utilisés.
SVN_REVISION_1.blurb=Identique à SVN_REVISION, mais pour le 1er emplacement (SVN_REVISION_2, 3, 4... peuvent être disponibles si vous ajoutez d''autres emplacements au job).
SVN_URL_1.blurb=Identique à SVN_URL, mais pour le 1er emplacement (SVN_URL_2, 3, 4... peuvent être disponibles si vous ajoutez d''autres emplacements au job).
SVN_REVISION_MAX.blurb=Numéro de révision maximal parmi tous les emplacements du job/build.
SVN_URL_MAX.blurb=URL de l''emplacement correspondant à SVN_REVISION_MAX.
