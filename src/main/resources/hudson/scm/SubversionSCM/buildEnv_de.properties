SVN_REVISION.blurb=Subversion-Revisionsnummer, die derzeit im Workspace ausgecheckt ist, z. B. "12345". Wird nicht gesetzt, wenn mehrere Modul-Speicherorte verwendet werden.
SVN_URL.blurb=Subversion-URL, die derzeit im Workspace ausgecheckt ist. Wird nicht gesetzt, wenn mehrere Modul-Speicherorte verwendet werden.
SVN_REVISION_1.blurb=Wie SVN_REVISION, jedoch für den ersten Speicherort (SVN_REVISION_2, 3, 4... können verfügbar sein, wenn dem Job weitere Speicherorte hinzugefügt werden).
SVN_URL_1.blurb=Wie SVN_URL, jedoch für den ersten Speicherort (SVN_URL_2, 3, 4... können verfügbar sein, wenn dem Job weitere Speicherorte hinzugefügt werden).
SVN_REVISION_MAX.blurb=Höchste Revisionsnummer aller Speicherorte im Job/Build.
SVN_URL_MAX.blurb=URL des Speicherorts mit SVN_REVISION_MAX.
