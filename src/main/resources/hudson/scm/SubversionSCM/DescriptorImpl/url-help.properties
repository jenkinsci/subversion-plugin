description.1=\
  Specify the subversion repository URL to check out, such as "http://svn.apache.org/repos/asf/ant/".
description.explicitRevision=\
  <br>You can also add "@NNN" at the end of the URL to check out a specific revision number, if that''s desirable. \
  This works for <a href="https://svnbook.red-bean.com/en/1.7/svn.tour.revs.specifiers.html" target="_blank">Subversion Revision Keywords and Dates</a> \
  like e.g. "@HEAD", too.
description.2=\
 <br>When you enter URL, Jenkins automatically checks if Jenkins can connect to it. If access requires \
 authentication, it will ask you the necessary credential. If you already have a working \
 credential but would like to change it for other reasons, \
 click <a href="{0}/scm/SubversionSCM/enterCredential" target="_blank">this link</a> \
 and specify different credential.
description.3=\
  <br>During the build, revision number of the module that was checked out is available \
  through the environment variable <tt>SVN_REVISION</tt>, provided that you are only checking out \
  one module. If you have multiple modules checked out use <tt>SVN_REVISION_1</tt>, <tt>SVN_REVISION_2</tt> etc.
  You can also use the <a href="https://svnbook.red-bean.com/en/1.7/svn.ref.svnversion.re.html" \
  target="_blank">svnversion command</a>.
description.4=\
  <br>URLs are available through similar environment variables as: <tt>SVN_URL_n</tt>.
